  <body>
    <a href="index.html" class="corner-logo-link">
      <img src="./src/assets/Logo.png" alt="Chroma" class="corner-logo" />
    </a>
    <div class="app-container">
      <h1 class="sr-only">Menu – Chroma Deli München</h1>
      <p class="sr-only">
        Die Speise- und Getränkekarte von Chroma – Deli &amp; Gift Shop in München.

      <div class="page-content">
        <nav class="nav-buttons events-nav">
          <div class="menu-board-container">
            <img src="./src/assets/Menu.svg" alt="Menu Board – Chroma Deli München" class="menu-board" />
            <img src="./src/assets/bee.png" alt="bee" class="decor menu-bee" />
          </div>
          <a href="index.html" class="nav-btn back-btn">Go Back</a>
        </nav>
      </div>
      <div class="decor menu-cidre-group">
        <img src="./src/assets/bottle.png" alt="bottle" class="cidre-bottle" />
        <img src="./src/assets/glass.png" alt="glass" class="cidre-glass" />
      </div>
      <!-- Decorations -->
      <img src="./src/assets/sandwich.png" alt="sandwich" class="decor sandwich" />
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const bee = document.querySelector('.menu-bee');
        if (bee) {
          bee.addEventListener('click', () => {
            bee.classList.add('fly-away');
          });
        }
      });
    </script>
    <script src="./transition.js"></script>
